name: docscanner
description: "Document scanner: live edge detection, perspective correction, filters, PDF export and cloud sync."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  camera: ^0.12.1
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  google_mlkit_text_recognition: ^0.17.1
  http: ^1.6.0
  intl: any
  opencv_dart: ^2.2.2
  path_provider: ^2.1.6
  pdf: ^3.13.1
  permission_handler: ^13.0.2
  printing: ^5.15.1
  share_plus: ^13.3.1
  uuid: ^4.6.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.31.1

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/samples/

hooks:
  user_defines:
    dartcv4:
      include_modules:
        - imgproc
        - imgcodecs
      macos:
        # Host builds (flutter test) use Ninja so they work with just the
        # Command Line Tools; iOS still uses the Xcode generator.
        generator: Ninja
