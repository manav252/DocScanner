<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Scan documents with your camera, clean them up and export PDFs.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="DocScanner">
  <meta name="theme-color" content="#1f5faf">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>DocScanner</title>
  <link rel="manifest" href="manifest.json">
  <script>
    // Serve pdf.js (used to import PDFs) from this app instead of a CDN, so it works offline.
    // It is pdf.js's "legacy" build: the modern one needs Safari 18.2+ (e.g. Uint8Array.toHex)
    // and failed on every PDF on older iPhones.
    window.dartPdfJsBaseUrl = new URL('pdfjs/', document.baseURI).href;
    // This page is always fetched fresh, even by an older offline copy (sw.js)
    // that serves the rest from its cache: ask the browser to check sw.js for a
    // newer one on every start (browsers alone may not for a day, or ever).
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistration().then((r) => r && r.update()).catch(() => {});
    }
  </script>
  <!-- OCR helper (loads Tesseract.js lazily on first use). -->
  <script src="ocr/ocr.js" defer></script>
  <!-- In front of the OpenCV worker; on iPhone/iPad decodes and encodes images on the page. -->
  <script src="opencv/engine_bridge.js"></script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
