# Render blueprint for the DocScanner backend (accounts, backup, sync).
# Database: Neon (free, does not expire). Page images: Cloudflare R2.
# Nothing deploys until you choose "New > Blueprint" in Render; see docs/DEPLOY.md.
# Secrets are entered in Render's dashboard (sync: false), never stored here.
services:
  - type: web
    name: docscanner-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: WEB_CONCURRENCY
        value: "1" # free instance: 512 MB
      - key: DOCSCANNER_ENVIRONMENT
        value: production
      - key: DOCSCANNER_JWT_SECRET
        generateValue: true
      - key: DOCSCANNER_CORS_ORIGINS
        value: '["https://manav252.github.io"]'
      - key: DATABASE_URL
        sync: false # Neon "direct" connection string
      - key: DOCSCANNER_S3_ENDPOINT
        sync: false # https://<account-id>.r2.cloudflarestorage.com
      - key: DOCSCANNER_S3_ACCESS_KEY
        sync: false
      - key: DOCSCANNER_S3_SECRET_KEY
        sync: false
      - key: DOCSCANNER_S3_BUCKET
        value: docscanner
      - key: DOCSCANNER_S3_REGION
        value: auto
      - key: DOCSCANNER_S3_CREATE_BUCKET
        value: "false"
