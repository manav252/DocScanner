# Publishes the showcase website and the web app to GitHub Pages:
#   https://<user>.github.io/<repo>/        website
#   https://<user>.github.io/<repo>/app/    web app
# Turn it on once: repository Settings > Pages > Source: "GitHub Actions".
# Backend for backup/sync: https://docscanner-api.onrender.com by default; if Render
# gives your service another URL, set it in Settings > Secrets and variables >
# Actions > Variables > API_URL (a public address, not a secret).
name: Deploy website and web app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - name: Build the web app
        working-directory: app
        run: |
          flutter pub get
          flutter build web --release --no-wasm-dry-run --no-web-resources-cdn \
            --base-href "/${{ github.event.repository.name }}/app/" \
            --dart-define=ASSET_VERSION=${{ github.sha }} \
            --dart-define=API_URL=${{ vars.API_URL || 'https://docscanner-api.onrender.com' }}
      - name: Offline file list
        run: python3 tools/pwa_precache.py
      - name: Assemble site
        run: |
          mkdir -p public
          cp -R website/. public/
          cp -R app/build/web public/app
          touch public/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
